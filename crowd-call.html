<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crowd Call</title>
<style>
:root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #f5f3ff; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
.card { position: absolute; bottom: 32px; left: 32px; width: 720px; padding: 26px; border: 2px solid #454052; border-radius: 12px; background: #18151f; box-shadow: 0 8px 32px #00000066; transition: opacity .4s; }
.card.hidden { opacity: 0; pointer-events: none; }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.eyebrow { font-size: 15px; font-weight: 800; letter-spacing: .16em; color: #bf94ff; margin-bottom: 6px; }
h1 { margin: 0; font-size: 30px; line-height: 1.25; color: #f5f3ff; overflow-wrap: anywhere; }
.clock { position: relative; flex: 0 0 72px; height: 72px; }
.clock svg { width: 72px; height: 72px; transform: rotate(-90deg); }
.clock circle { fill: none; stroke-width: 5; }
.track { stroke: #3b334b; }.progress { stroke: #bf94ff; stroke-linecap: round; }
#seconds { position: absolute; inset: 0; display: grid; place-items: center; font-size: 23px; font-weight: 800; font-variant-numeric: tabular-nums; }
.options { display: grid; gap: 12px; }
.option { position: relative; overflow: hidden; border: 2px solid #454052; border-radius: 10px; background: #24202e; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; background: #58358c; transition: width .45s ease; }
.row { position: relative; display: flex; align-items: center; gap: 12px; padding: 15px 16px; min-height: 62px; font-size: 22px; font-weight: 700; }
.command { color: #fff; background: #6441a5; border-radius: 6px; padding: 3px 8px; font-size: 18px; flex-shrink: 0; }
.label { flex: 1; overflow-wrap: anywhere; }.count { font-variant-numeric: tabular-nums; font-size: 20px; }.percent { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.option.winner { border-color: #bf94ff; box-shadow: inset 0 0 0 1px #bf94ff; }.winner .fill { background: #7146ad; }
footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 18px; font-size: 15px; line-height: 1.6; color: #c4bdd0; }
#status::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #a29aaf; margin-right: 7px; }#status.live::before { background: #4ade80; }
#result { margin: 18px 0 0; color: #f5f3ff; font-size: 25px; font-weight: 800; overflow-wrap: anywhere; }#result:empty { display: none; }
#selftest { white-space: pre-wrap; font: 15px/1.6 monospace; color: #f5f3ff; margin-top: 16px; }
@media (max-width: 783px) { .card { left: 16px; bottom: 16px; width: calc(100% - 32px); padding: 18px; } h1 { font-size: 25px; }.row { font-size: 18px; padding: 12px; gap: 8px; } .percent { min-width: 52px; } }
@media (prefers-reduced-motion: reduce) { .fill, .card { transition: none; } }
@media print { @page { margin: .4in; } html, body { height: auto; overflow: visible; } .card { position: static; width: 100%; box-shadow: none; break-inside: avoid; opacity: 1 !important; } * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>
<main class="card" id="card">
<header><div><div class="eyebrow">CROWD CALL</div><h1 id="question"></h1></div><div class="clock" aria-label="Time remaining"><svg viewBox="0 0 72 72" aria-hidden="true"><circle class="track" cx="36" cy="36" r="31"/><circle class="progress" id="ring" cx="36" cy="36" r="31"/></svg><span id="seconds"></span></div></header>
<div class="options" id="options"></div>
<p id="result" role="status"></p>
<footer><span id="status">Starting…</span><span id="total">0 votes · type !a or !b</span></footer>
<div id="selftest" hidden></div>
</main>
<script>
'use strict';
// IRC parsing is independent of the connection so fixtures can exercise it offline.
function parseIRC(line) {
  const match = /^(?:@\S+ )?(?::(\S+) )?([A-Za-z0-9]+)(?: (.*))?$/.exec(line);
  if (!match) return null;
  const rest = match[3] || '';
  const trailingAt = rest.startsWith(':') ? 0 : rest.indexOf(' :');
  const params = (trailingAt < 0 ? rest : rest.slice(0, trailingAt)).trim().split(/\s+/).filter(Boolean);
  const trailing = trailingAt < 0 ? null : rest.slice(trailingAt + (trailingAt === 0 ? 1 : 2));
  return { prefix: match[1] || '', command: match[2].toUpperCase(), params, trailing };
}
function voteCommand(message) {
  const token = message.trim().split(/\s+/)[0].toLowerCase();
  return /^![abc]$/.test(token) ? token.slice(1) : null;
}
function recordVote(votes, username, message, keys, active) {
  const key = voteCommand(message);
  if (!active || !key || !keys.includes(key) || !username) return false;
  votes.set(username.toLowerCase(), key);
  return true;
}
function runSelfTests() {
  let passed = 0;
  function check(condition, name) { if (!condition) throw new Error(name); passed++; }
  const msg = parseIRC(':Alice!alice@alice.tmi.twitch.tv PRIVMSG #test :!B extra words');
  check(msg.command === 'PRIVMSG' && msg.prefix.split('!')[0] === 'Alice' && msg.params[0] === '#test', 'PRIVMSG prefix and channel');
  check(voteCommand(msg.trailing) === 'b', 'Case-insensitive first token');
  check(parseIRC('PING :tmi.twitch.tv').trailing === 'tmi.twitch.tv', 'PING payload');
  check(parseIRC('@id=123;display-name=Bob :bob!b@b PRIVMSG #test :!c').trailing === '!c', 'IRC tags');
  check(parseIRC(':server 001 justinfan12345 :Welcome').command === '001', 'Welcome numeric');
  check(parseIRC('') === null && voteCommand('!ab') === null && voteCommand('hello !a') === null, 'Reject malformed and non-vote commands');
  const votes = new Map();
  recordVote(votes, 'Alice', '!a', ['a', 'b'], true);
  recordVote(votes, 'ALICE', '!b later', ['a', 'b'], true);
  check(votes.size === 1 && votes.get('alice') === 'b', 'Later vote moves without duplication');
  check(!recordVote(votes, 'bob', '!c', ['a', 'b'], true), 'Unavailable option ignored');
  check(!recordVote(votes, 'alice', '!a', ['a', 'b'], false) && votes.get('alice') === 'b', 'Closed poll ignores votes');
  return passed + ' self-tests passed';
}
const config = new URLSearchParams(location.search);
const demo = config.get('demo') === '1';
const testing = config.get('selftest') === '1';
const channel = (config.get('channel') || '').replace(/^#/, '').toLowerCase();
const durationValue = Number(config.get('t') || 60);
const duration = Number.isFinite(durationValue) && durationValue > 0 ? durationValue : 60;
const choices = [ ['a', config.get('a') || 'Option A'], ['b', config.get('b') || 'Option B'] ];
if (config.get('c')?.trim()) choices.push(['c', config.get('c')]);
const keys = choices.map(([key]) => key);
const votes = new Map();
const $ = id => document.getElementById(id);
$('question').textContent = config.get('q') || 'What should we do next?';
const rows = choices.map(([key, label]) => {
  const row = document.createElement('div'); row.className = 'option';
  const fill = document.createElement('div'); fill.className = 'fill';
  const content = document.createElement('div'); content.className = 'row';
  const elements = ['command', 'label', 'count', 'percent'].map(className => { const span = document.createElement('span'); span.className = className; content.append(span); return span; });
  elements[0].textContent = '!' + key; elements[1].textContent = label;
  row.append(fill, content); $('options').append(row);
  return { row, fill, count: elements[2], percent: elements[3] };
});
function render() {
  const counts = keys.map(key => [...votes.values()].filter(vote => vote === key).length);
  rows.forEach((row, i) => {
    const percent = votes.size ? counts[i] / votes.size * 100 : 0;
    row.fill.style.width = percent + '%'; row.count.textContent = counts[i]; row.percent.textContent = Math.round(percent) + '%';
  });
  $('total').textContent = `${votes.size} ${votes.size === 1 ? 'vote' : 'votes'} · type ${keys.map(key => '!' + key).join(' / ')}`;
  return counts;
}
let ended = false, socket, reconnectTimer, demoTimer, frame, disposed = false;
const circumference = 2 * Math.PI * 31;
$('ring').style.strokeDasharray = circumference;
function status(text, live = false) { $('status').textContent = text; $('status').className = live ? 'live' : ''; }
function cleanup() { disposed = true; clearTimeout(reconnectTimer); clearInterval(demoTimer); cancelAnimationFrame(frame); if (socket) socket.close(); }
function finish() {
  if (ended) return;
  ended = true;
  const counts = render(), max = Math.max(...counts);
  const winners = choices.filter((_, i) => counts[i] === max);
  rows.forEach((row, i) => row.row.classList.toggle('winner', max > 0 && counts[i] === max));
  $('result').textContent = max === 0 ? 'No votes this round' : winners.length === 1 ? 'Chat picked: ' + winners[0][1] : 'Chat picked: Tie — ' + winners.map(([, label]) => label).join(' / ');
  cleanup(); status('Voting closed');
  setTimeout(() => $('card').classList.add('hidden'), 10000);
}
function accept(username, message) { if (recordVote(votes, username, message, keys, !ended && performance.now() < deadline)) render(); }
const deadline = performance.now() + duration * 1000;
function tick() {
  const remaining = Math.max(0, deadline - performance.now());
  $('seconds').textContent = Math.ceil(remaining / 1000);
  $('ring').style.strokeDashoffset = circumference * (1 - remaining / (duration * 1000));
  if (remaining === 0) finish(); else frame = requestAnimationFrame(tick);
}
function connect() {
  if (disposed) return;
  status('Connecting to #' + channel + '…');
  socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  let buffer = '';
  socket.onopen = () => {
    socket.send('PASS SCHMOOPIIE\r\n');
    socket.send('NICK justinfan' + Math.floor(10000 + Math.random() * 90000) + '\r\n');
    socket.send('JOIN #' + channel + '\r\n');
  };
  socket.onmessage = event => {
    buffer += event.data;
    const lines = buffer.split('\r\n'); buffer = lines.pop();
    for (const line of lines) {
      const msg = parseIRC(line); if (!msg) continue;
      if (msg.command === 'PING') socket.send('PONG :' + (msg.trailing || msg.params.join(' ')) + '\r\n');
      if ((msg.command === 'JOIN' && (msg.params[0] || msg.trailing) === '#' + channel) || (msg.command === '366' && msg.params.includes('#' + channel))) status('connected to #' + channel, true);
      if (msg.command === 'PRIVMSG' && msg.params[0] === '#' + channel && msg.prefix.includes('!')) accept(msg.prefix.split('!')[0], msg.trailing || '');
      if (msg.command === 'RECONNECT') socket.close();
      if (msg.command === 'NOTICE') status(msg.trailing || 'Twitch notice');
    }
  };
  socket.onerror = () => status('Connection error · retrying…');
  socket.onclose = () => { if (!disposed) { status('Disconnected · retrying…'); reconnectTimer = setTimeout(connect, 3000); } };
}
render();
if (testing) {
  $('selftest').hidden = false;
  try { $('selftest').textContent = runSelfTests(); document.documentElement.dataset.selftest = 'passed'; }
  catch (error) { $('selftest').textContent = 'FAIL: ' + error.message; document.documentElement.dataset.selftest = 'failed'; console.error(error); }
}
if (!demo && !testing && !/^[a-z0-9_]{1,25}$/.test(channel)) {
  status('Add a valid ?channel=yourchannel to the URL'); $('seconds').textContent = '—';
} else if (testing && !demo) { status('Offline parser self-test'); $('seconds').textContent = '—'; }
else {
  tick();
  if (demo) {
    status('Demo · simulated chat', true);
    demoTimer = setInterval(() => accept('viewer' + Math.floor(Math.random() * 80), '!' + keys[Math.floor(Math.random() * keys.length)]), 180);
  } else connect();
}
window.addEventListener('pagehide', cleanup);
</script>
</body>
</html>
